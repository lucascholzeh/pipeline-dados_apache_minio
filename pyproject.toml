[project]
name = "pipeline-dados"
version = "0.1.0"
description = "Pipeline de Dados: SQL Server -> MinIO (CSV) -> Delta Lake"
requires-python = ">=3.11,<3.13"
dependencies = [
    "pyspark==3.5.3",
    "delta-spark==3.2.0",
    "boto3>=1.34.0",
    "pandas>=2.2.0",
    "pyodbc>=5.1.0",
    "python-dotenv>=1.0.0",
    "jupyterlab>=4.2.0",
    "ipykernel>=6.29.0",
]

[tool.uv]
dev-dependencies = [
    "mkdocs>=1.6.0",
    "mkdocs-material>=9.5.0",
    "mkdocstrings[python]>=0.25.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
